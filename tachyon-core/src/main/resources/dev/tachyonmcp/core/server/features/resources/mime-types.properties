#
# Default filename-extension-to-MIME-type mapping used by
# dev.tachyonmcp.core.server.features.resources.MimeTypes. Extension (without the leading '.',
# lowercase) = MIME type.

md=text/markdown
markdown=text/markdown
txt=text/plain
py=text/plain
sh=text/plain
json=application/json
js=text/javascript
mjs=text/javascript
yaml=application/yaml
yml=application/yaml
toml=application/toml
csv=text/csv
html=text/html
htm=text/html
png=image/png
jpg=image/jpeg
jpeg=image/jpeg
gif=image/gif
svg=image/svg+xml
webp=image/webp
