comment:
  layout: "header, diff, flags, components"

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        branches:
          - "!main"

  individual_components:
    - component_id: tachyon-api
      name: Tachyon API
      flag_regexes:
        - "tachyon-api"
    - component_id: tachyon-core
      name: Tachyon Core
      flag_regexes:
        - "tachyon-core"
    - component_id: tachyon-kotlin
      name: Tachyon Kotlin DSL
      flag_regexes:
        - "tachyon-kotlin"
    - component_id: tachyon-extensions
      name: Tachyon Extensions
      flag_regexes:
        - "tachyon-extensions"
    - component_id: e2e
      name: E2E Tests
      flag_regexes:
        - "e2e"
    - component_id: conformance
      name: Conformance Tests
      flag_regexes:
        - "conformance"
    - component_id: example-echo-kotlin
      name: Example Echo Kotlin
      flag_regexes:
        - "example-echo-kotlin"
    - component_id: example-weather
      name: Example Weather
      flag_regexes:
        - "example-weather"
    - component_id: example-weather-mcp-kotlin
      name: Example Weather MCP Kotlin
      flag_regexes:
        - "example-weather-mcp-kotlin"
